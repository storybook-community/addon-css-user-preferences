name: release

# Only main. The previous workflow was `on: [push]` with no filter, so every
# push to every branch attempted a release.
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    needs: verify
    # Declaring permissions replaces the default set, so every scope the called
    # workflow declares must be listed here — unlisted ones drop to none, and a
    # callee asking for more than the caller holds fails the run at startup.
    permissions:
      # Mints the OIDC token npm exchanges for short-lived publish credentials.
      id-token: write
      # Lets changesets/action push the version branch and tags.
      contents: write
      # Lets changesets/action open the "version packages" PR.
      pull-requests: write
    # Secretless: publishes through npm trusted publishing, so the repo needs no
    # NPM_TOKEN. The trusted publisher registered on npm must name THIS file
    # (release.yml), not the reusable workflow's — npm validates the caller.
    #
    # storybook-community/.github has no reusable release workflow of its own; it
    # ships only the setup-playwright action. Until it does, this borrows
    # unional/.github, which is public. The @v2 line pairs changesets/action@v2
    # with @changesets/cli v3, which is what package.json pins.
    uses: unional/.github/.github/workflows/pnpm-release-changeset-oidc.yml@v2
